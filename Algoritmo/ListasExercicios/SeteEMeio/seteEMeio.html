    let pontosBanca = 0;

    let primeiraChance = false;
    let passoiVez = false;
    let chancesJogador = 0;

    function iniciar() {
        pontosJogador = 0;
        pontosBanca = 0;

        primeiraChance = false;
        passoiVez = false;
        chancesJogador = 0;

        div_jogo.innerHTML = ``;
        div_msg.innerHTML = '';
        div_jogo.innerHTML = `        
            <button onclick="sorteio()">Pedir Outra Carta</button>
            <button onclick="passar()">Passar Vez</button><br>`;
        if (primeiraChance == false) {
            primeiraChance = true;

            sorteio();
        }
    }

    function sorteio() {
        let i = 0;
        chancesJogador++;

        if (chancesJogador > 1) {
            div_msg.innerHTML += `<br>Quero mais uma carta!<br>`;
        }

        while (i > -1) {
            let carta = parseInt((Math.random() * 40));

            if (baralho[carta].qtd == 0) {
                i++;

            } else if (passoiVez == false) {
                baralho[carta].qtd = 0;
                i = -1;

                verifJogador(baralho[carta].valor, baralho[carta].naipe);
            } else {
                baralho[carta].qtd = 0;
                i = -1;

                verifBanca(baralho[carta].valor, baralho[carta].naipe);
            }
        }
    }

    function verifJogador(valor, naipe) {
        if (valor == 'Ás') {
            pontosJogador++;

        } else if (valor >= 2 && valor <= 7) {
            pontosJogador += Number(valor);

        } else {
            pontosJogador += 0.5;

        }
        if (pontosJogador == 7.5) {
            div_jogo.innerHTML = ``;

            div_msg.innerHTML += `<br>SETE E MEIO! O pontosJogador venceu com 7.5 pontos!
            <br>Deseja div_jogo de novo? <br><br>
            <button onclick="iniciar()">Jogar Sete e Meio!</button>`;
        } else if (pontosJogador > 7.5) {
            div_jogo.innerHTML = ``;

            div_msg.innerHTML += `<br>Jogador: ${pontosJogador} pontos - ${valor} de ${naipe}
            <br><br>O JOGADOR ESTOUROU! A banca venceu com ${pontosBanca} pontos
            <br><br>Deseja div_jogo de novo? <br><br>

        } else {
            
            div_msg.innerHTML += `<br>Jogador: ${pontosJogador} pontos - ${valor} de ${naipe}`;
        }
    }

    function passar() {
        passoiVez = true;

        sorteio();
    }
