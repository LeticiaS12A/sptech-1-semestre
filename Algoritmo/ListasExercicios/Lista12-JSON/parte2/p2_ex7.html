<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercicio 7</title>
</head>
<body>
    <h3>Biblioteca de Jogos de Tabuleiro</h3>

    Nome do jogo:
    <input type="text" id="ipt_nome"><br><br>
    Quantidade de jogadores:
    <input type="text" id="ipt_jogadores">
    <button onclick="cadastrar()">Cadastrar Jogo</button><br><br>
    <button onclick="listar()">Listar Jogos</button><br><br>

    Quantidade de jogadores:
    <input type="text" id="ipt_filtro">
    <button onclick="filtrar()">Filtrar por Jogadores</button><br><br>

    <div id="div_msg"></div>
</body>
</html>
<script>
    let lista = [];

    function cadastrar(){
        let jogo = {
            nome: ipt_nome.value,
            jogadores: Number(ipt_jogadores.value)
        }
        lista.push(jogo);

        div_msg.innerHTML = `Jogo cadastrado com sucesso`;
    }

    function listar(){
        div_msg.innerHTML = `Total de jogos cadastrados: ${lista.length}<br><br>`;

        for(let i = 0; i < lista.length; i++){
            div_msg.innerHTML += `
                ${lista[i].nome} - ${lista[i].jogadores} jogadores<br>
            `;
        }
    }

    function filtrar(){
        let qtd = Number(ipt_filtro.value);

        div_msg.innerHTML = ``;

        for(let i = 0; i < lista.length; i++){
            if(lista[i].jogadores == qtd){
                div_msg.innerHTML += `
                    ${lista[i].nome} - ${lista[i].jogadores} jogadores<br>
                `;
            }
        }
    }
</script>
