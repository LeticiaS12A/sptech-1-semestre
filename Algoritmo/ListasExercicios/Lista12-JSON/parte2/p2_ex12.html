<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercicio 12</title>
</head>
<body>
    <h3>Catálogo de Filmes</h3>

    Nome do filme:
    <input type="text" id="ipt_filme"><br><br>
    Gênero:
    <input type="text" id="ipt_genero">
    <button onclick="cadastrar()">Cadastrar</button><br><br>
    <button onclick="listar()">Listar Filmes</button><br><br>

    De:
    <input type="text" id="ipt_de">
    Até:
    <input type="text" id="ipt_ate">
    <button onclick="filtrarRegistro()">Filtrar Filmes por Registro</button><br><br>

    Gênero:
    <input type="text" id="ipt_generoFiltro">
    <button onclick="filtrarGenero()">Filtrar Filmes por Gênero</button><br><br>

    <div id="div_msg"></div>
</body>
</html>
<script>
    let lista = [];

    function cadastrar(){
        let filme = {
            nome: ipt_filme.value,
            genero: ipt_genero.value
        }
        lista.push(filme);

        div_msg.innerHTML = `Você já assistiu ${lista.length} filmes`;
    }

    function listar(){
        div_msg.innerHTML = ``;

        for(let i = lista.length - 1; i >= 0; i--){
            div_msg.innerHTML += `
                ${lista[i].nome} - ${lista[i].genero}<br>
            `;
        }
    }

    function filtrarRegistro(){
        let inicio = Number(ipt_de.value);
        let fim = Number(ipt_ate.value);

        div_msg.innerHTML = ``;

        for(let i = fim - 1; i >= inicio - 1; i--){
            div_msg.innerHTML += `
                ${lista[i].nome} - ${lista[i].genero}<br>
            `;
        }
    }

    function filtrarGenero(){
        let genero = ipt_generoFiltro.value;

        div_msg.innerHTML = ``;

        for(let i = 0; i < lista.length; i++){
            if(lista[i].genero == genero){
                div_msg.innerHTML += `
                    ${lista[i].nome} - ${lista[i].genero}<br>
                `;
            }
        }
    }
</script>
