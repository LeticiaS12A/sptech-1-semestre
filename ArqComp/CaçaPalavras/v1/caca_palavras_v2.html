<!DOCTYPE html>

    <title>Caça-Palavras</title>

    <style>
        body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    margin: 0;
    padding: 30px;
    color: white;
}

.container {
    width: 950px;
    margin: auto;
    background-color: #111827;
    padding: 10px 50px;
    border-radius: 20px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
}

h1 {
    color: #38bdf8;
    font-size: 28px;
    margin-bottom: 5px;
}

h2 {
    color: #cbd5e1;
    font-size: 20px;
    margin-bottom: 10px;
}

.pergunta {
    font-size: 18px;
    margin-bottom: 20px;
    background-color: #1e293b;
    padding: 12px;
    border-radius: 10px;
}

input {
    padding: 12px;
    width: 250px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background-color: #38bdf8;
    color: black;
    font-weight: bold;
    cursor: pointer;
    margin-left: 10px;
    transition: 0.3s;
}

button:hover {
    background-color: #0ea5e9;
}

#mensagem {
    margin-top: 10px;
    font-size: 18px;
}

.cacaPalavras {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(15, 45px);
    gap: 6px;
    justify-content: center;
    background-color: #1e293b;
    padding: 20px;
    border-radius: 15px;
}

.letra {
    width: 45px;
    height: 45px;
    background-color: #334155;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 18px;
    transition: 0.3s;
}

.letra:hover {
    transform: scale(1.05);
    background-color: #475569;
}

.correta {
    background-color: #38bdf8;
    color: black;
    transform: scale(1.08);
}
    </style>
</head>

<script>
    var perguntas = [
        {
            pergunta: 'Qual componente do computador é responsável por interpretar comandos e executar operações?',
            resposta: 'CPU',
            classe: 'cpu'
        },{
            pergunta: 'Qual parte interna do processador executa operações lógicas e cálculos matemáticos?',
            resposta: 'ULA',
            classe: 'ula'
        },{
            pergunta: ' PC, IR, MAR e MBR são exemplos de qual estrutura localizada dentro da CPU?',
            resposta: 'REGISTRADORES',
            classe: 'registradores'
        },{
            pergunta: 'Qual memória armazena temporariamente os dados utilizados pelos programas em execução?',
            resposta: 'RAM',
            classe: 'ram'
        },{
            pergunta: 'Qual memória mantém dados gravados mesmo após o desligamento do computador?',
            resposta: 'ROM',
            classe: 'rom'
        },{
            pergunta: 'Qual memória mantém dados gravados mesmo após o desligamento do computador?',
            resposta: 'Eprom',
            classe: 'rom'
        },{
            pergunta: 'Qual memória mantém dados gravados mesmo após o desligamento do computador?',
            resposta: 'ROM',
            classe: 'flash'
        },{
            pergunta: 'Qual memória mantém dados gravados mesmo após o desligamento do computador?',
            resposta: 'MS',
            classe: 'memoria de massa'
        },{
            pergunta: 'Qual recurso permite transferência direta de dados entre periféricos e memória RAM?',
            resposta: 'DMA',
            classe: 'dma'
        },{
            pergunta: 'Qual sinal é utilizado para habilitar um chip específico durante a comunicação com o processador?',
            resposta: 'CS',
            classe: 'cs'
        },{
            pergunta: 'Qual barramento é responsável por transportar os endereços de memória solicitados pela CPU?',
            resposta: 'ADRESS BUS',
            classe: 'adress bus'
        },{
            pergunta: 'Qual barramento transfere informações entre memória, processador e dispositivos periféricos?',
            resposta: 'DATA BUS',
            classe: 'data bus'
        },{
            pergunta: 'Qual linha da Intel oferece desempenho intermediário para multitarefas e jogos?',
            resposta: 'I5',
            classe: 'i5'
        },{
            pergunta: 'Qual série de processadores Intel é voltada para aplicações de maior desempenho?',
            resposta: 'I7',
            classe: 'i7'
        },{
            pergunta: 'Como é chamado o processador que possui dois núcleos físicos de processamento?',
            resposta: 'DUAL CORE',
            classe: 'dual core'
        },{
            pergunta: 'Qual sinal é utilizado para habilitar um chip específico durante a comunicação com o processador?',
            resposta: 'QUAD CORE',
            classe: 'quad core'
        }
    ];
    var indice = 0;

    pergunta.innerHTML = perguntas[indice].pergunta;

    function verificar() {
        var respostaUsuario = inputResposta.value.toUpperCase().replaceAll(' ', '');
        var respostaCorreta = perguntas[indice].resposta;

        if(respostaUsuario == respostaCorreta){

            mensagem.innerHTML = 'Resposta correta!';

            var letras = document.querySelectorAll('.' + perguntas[indice].classe);

            for(var i = 0; i < letras.length; i++){
                letras[i].classList.add('correta');
            }
            indice++;

            if(indice < perguntas.length){
                pergunta.innerHTML = perguntas[indice].pergunta;
            } else {
                pergunta.innerHTML = 'Você terminou o caça-palavras!';
            }

        } else {
            mensagem.innerHTML = 'Resposta incorreta!';
        }

        inputResposta.value = '';
    }
</script>
