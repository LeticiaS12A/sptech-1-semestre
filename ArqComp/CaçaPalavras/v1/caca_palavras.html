<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Caça-Palavras</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f0f0;
            text-align: center;
        }

        .container {
            width: 900px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .pergunta {
            margin-top: 20px;
            font-size: 18px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        .cacaPalavras {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(15, 40px);
            justify-content: center;
            gap: 5px;
        }

        .letra {
            width: 40px;
            height: 40px;
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .correta {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Caça-Palavras</h1>
        <h2>Arquitetura Computacional</h2>

        <div class="pergunta" id="pergunta"></div>

        <br>

        <input type="text" id="inputResposta">
        <button onclick="verificar()">Verificar</button>

        <h3 id="mensagem"></h3>

        <div class="cacaPalavras">
            <!-- CPU horizontal -->
<div class="letra">A</div>
<div class="letra cpu">C</div>
<div class="letra cpu">P</div>
<div class="letra cpu">U</div>
<div class="letra">X</div>

<!-- ULA vertical -->
<div class="letra ula">U</div>
<div class="letra">K</div>
<div class="letra">P</div>
<div class="letra">Q</div>
<div class="letra">R</div>

<div class="letra ula">L</div>
<div class="letra">M</div>
<div class="letra">N</div>
<div class="letra">T</div>
<div class="letra">Y</div>

<div class="letra ula">A</div>
<div class="letra">B</div>
<div class="letra">C</div>
<div class="letra">D</div>
<div class="letra">E</div>

<!-- RAM diagonal -->
<div class="letra ram">R</div>
<div class="letra">G</div>
<div class="letra">H</div>
<div class="letra">I</div>
<div class="letra">J</div>

<div class="letra">L</div>
<div class="letra ram">A</div>
<div class="letra">O</div>
<div class="letra">P</div>
<div class="letra">S</div>

<div class="letra">T</div>
<div class="letra">U</div>
<div class="letra ram">M</div>
<div class="letra">V</div>
<div class="letra">W</div>

<!-- ROM horizontal invertida -->
<div class="letra">F</div>
<div class="letra rom">M</div>
<div class="letra rom">O</div>
<div class="letra rom">R</div>
<div class="letra">G</div>

<!-- DMA vertical invertida -->
<div class="letra">A</div>
<div class="letra">B</div>
<div class="letra dma">A</div>
<div class="letra">C</div>
<div class="letra">D</div>

<div class="letra">E</div>
<div class="letra">F</div>
<div class="letra dma">M</div>
<div class="letra">G</div>
<div class="letra">H</div>

<div class="letra">I</div>
<div class="letra">J</div>
<div class="letra dma">D</div>
<div class="letra">K</div>
<div class="letra">L</div>

<!-- FLASH horizontal -->
<div class="letra flash">F</div>
<div class="letra flash">L</div>
<div class="letra flash">A</div>
<div class="letra flash">S</div>
<div class="letra flash">H</div>

<!-- I5 cruzada -->
<div class="letra i5">I</div>
<div class="letra">M</div>
<div class="letra">N</div>

<div class="letra">P</div>
<div class="letra i5">5</div>
<div class="letra">Q</div>

<!-- I7 diagonal -->
<div class="letra i7">I</div>
<div class="letra">A</div>

<div class="letra">B</div>
<div class="letra i7">7</div>

</div>

    </div>


</body>
</html>
<script>
    var perguntas = [
        {
            pergunta: 'Qual componente do computador é responsável por interpretar comandos e executar operações?',
            resposta: 'CPU',
            classe: 'cpu'
        },{
            pergunta: 'Qual parte interna do processador executa operações lógicas e cálculos matemáticos?',
            resposta: 'ULA',
            classe: 'ula'
        },{
            pergunta: 'Qual memória armazena temporariamente os dados utilizados pelos programas em execução?',
            resposta: 'RAM',
            classe: 'ram'
        },{
            pergunta: 'Qual memória mantém dados gravados mesmo após o desligamento do computador?',
            resposta: 'ROM',
            classe: 'rom'
        },{
            pergunta: 'Qual recurso permite transferência direta de dados entre periféricos e memória RAM?',
            resposta: 'DMA',
            classe: 'dma'
        }
    ];
    var indice = 0;

    pergunta.innerHTML = perguntas[indice].pergunta;

    function verificar() {
        var respostaUsuario = inputResposta.value.toUpperCase().replaceAll(' ', '');
        var respostaCorreta = perguntas[indice].resposta;

        if(respostaUsuario == respostaCorreta){

            mensagem.innerHTML = 'Resposta correta!';

            var letras = document.querySelectorAll('.' + perguntas[indice].classe);

            for(var i = 0; i < letras.length; i++){
                letras[i].classList.add('correta');
            }

            indice++;

            if(indice < perguntas.length){
                pergunta.innerHTML = perguntas[indice].pergunta;
            } else {
                pergunta.innerHTML = 'Você terminou o caça-palavras!';
            }

        } else {
            mensagem.innerHTML = 'Resposta incorreta!';
        }

        inputResposta.value = '';
    }
</script>
