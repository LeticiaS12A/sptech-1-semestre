            "DATA BUS": ["data", 7],
            "I5": ["i5", 2],
            "I7": ["i7", 2],
            "DUAL CORE": ["dual", 8],
            "QUAD CORE": ["quad", 8]
        };

        var info = palavras[palavra];

            var prefixo = info[0];
            var quantidade = info[1];

            }
